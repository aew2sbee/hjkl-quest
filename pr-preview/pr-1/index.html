<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/hjkl-quest/pr-preview/pr-1/favicon.svg"><meta name="robots" content="noindex, nofollow"><title>hjkl-quest</title><script>(function(){const base = "/hjkl-quest/pr-preview/pr-1/";
const langs = ["ja","en"];
const langKey = "hjkl-quest@/hjkl-quest/pr-preview/pr-1/:lang";

      // Saved choice first, then the browser language, then English.
      let lang = null;
      try {
        lang = localStorage.getItem(langKey);
      } catch {}
      if (!langs.includes(lang)) {
        lang = (navigator.languages || [navigator.language])
          .map((l) => l.slice(0, 2).toLowerCase())
          .find((l) => langs.includes(l)) || 'en';
      }
      location.replace(base + lang + '/');
    })();</script></head><body style="background:#0e1712;color:#e8f3ec;font-family:sans-serif;padding:24px"><p>Choose a language / 言語を選択してください</p><ul><li><a style="color:#7ee08f" href="/hjkl-quest/pr-preview/pr-1/ja/">日本語</a></li><li><a style="color:#7ee08f" href="/hjkl-quest/pr-preview/pr-1/en/">English</a></li></ul></body></html>
